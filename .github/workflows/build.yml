name: Build FindMap APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Generate Android project
        run: |
          APP=build_app
          P=$APP/app/src/main
          mkdir -p $P/java/com/findmap/navigation $P/assets $P/res/mipmap-xxxhdpi
          cp FindMap.html $P/assets/index.html

          # Icon from logo.jpg (black bg, white pin + crosshair)
          sudo apt-get install -y imagemagick >/dev/null 2>&1 || true
          IM=$(command -v magick || command -v convert)
          $IM logo.jpg -fuzz 15% -trim +repage -resize 400x400 -background black -gravity center -extent 560x560 -resize 192x192 $P/res/mipmap-xxxhdpi/ic_launcher.png

          cat > $APP/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "FindMap"
          include ':app'
          EOF
          cat > $APP/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > $APP/gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF
          cat > $APP/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.findmap.navigation'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.findmap.navigation'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              signingConfigs {
                  release {
                      storeFile file('findmap.jks')
                      storePassword 'findmap123'
                      keyAlias 'findmap'
                      keyPassword 'findmap123'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'com.google.android.gms:play-services-location:21.3.0'
          }
          EOF
          cat > $P/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <application android:label="FindMap" android:icon="@mipmap/ic_launcher" android:theme="@android:style/Theme.Black.NoTitleBar">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > $P/java/com/findmap/navigation/MainActivity.java <<'EOF'
          package com.findmap.navigation;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.*;
          import android.provider.Settings;
          import android.view.WindowManager;
          import android.webkit.*;
          import com.google.android.gms.location.*;

          public class MainActivity extends Activity {
              WebView w;
              FusedLocationProviderClient fl;
              LocationCallback cb;
              boolean on = false;

              boolean has() {
                  return checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED;
              }

              void js(final String s) {
                  runOnUiThread(new Runnable() { public void run() { if (w != null) w.evaluateJavascript(s, null); } });
              }

              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  w = new WebView(this);
                  w.setBackgroundColor(0xFF000000);
                  setContentView(w);
                  WebSettings s = w.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowUniversalAccessFromFileURLs(true);
                  w.setWebViewClient(new WebViewClient());
                  fl = LocationServices.getFusedLocationProviderClient(this);
                  w.addJavascriptInterface(new Object() {
                      @JavascriptInterface public boolean has() { return MainActivity.this.has(); }
                      @JavascriptInterface public void req() {
                          runOnUiThread(new Runnable() { public void run() {
                              requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION}, 1);
                          } });
                      }
                      @JavascriptInterface public void settings() {
                          startActivity(new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:" + getPackageName())));
                      }
                      @JavascriptInterface public void start() {
                          runOnUiThread(new Runnable() { public void run() { startLoc(); } });
                      }
                      @JavascriptInterface public void vib() {
                          Vibrator v = (Vibrator) getSystemService(VIBRATOR_SERVICE);
                          if (Build.VERSION.SDK_INT >= 26) v.vibrate(VibrationEffect.createWaveform(new long[]{0, 400, 150, 400, 150, 600}, -1));
                          else v.vibrate(1200);
                      }
                  }, "Android");
                  w.loadUrl("file:///android_asset/index.html");
              }

              @SuppressWarnings("MissingPermission")
              void startLoc() {
                  if (on || !has()) return;
                  on = true;
                  LocationRequest r = new LocationRequest.Builder(Priority.PRIORITY_HIGH_ACCURACY, 2000).setMinUpdateIntervalMillis(1000).build();
                  cb = new LocationCallback() {
                      @Override public void onLocationResult(LocationResult x) {
                          android.location.Location l = x.getLastLocation();
                          if (l != null) js("onLoc(" + l.getLatitude() + "," + l.getLongitude() + "," + l.getAccuracy() + ")");
                      }
                  };
                  fl.requestLocationUpdates(r, cb, Looper.getMainLooper());
              }

              @Override public void onRequestPermissionsResult(int c, String[] p, int[] g) {
                  js("window.onPerm&&onPerm(" + has() + ")");
              }

              @Override protected void onResume() {
                  super.onResume();
                  js("window.onPerm&&onPerm(" + has() + ")");
              }

              @Override protected void onDestroy() {
                  if (cb != null) fl.removeLocationUpdates(cb);
                  super.onDestroy();
              }
          }
          EOF
          keytool -genkeypair -keystore $APP/app/findmap.jks -alias findmap -keyalg RSA -keysize 2048 -validity 10000 -storepass findmap123 -keypass findmap123 -dname "CN=FindMap,O=FindMap,C=AZ"
      - name: Build signed APK
        run: |
          cd build_app
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../FindMapV1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FindMapV1
          path: FindMapV1.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: V1
          name: FindMap V1
          files: FindMapV1.apk
